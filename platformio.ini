; PlatformIO Project Configuration File
;
; Boards (compile-time selection via -D FLIGHTSCNR_BOARD_*):
;   auto                — detect plugged-in board (falls back to tencoder-pro)
;   tencoder-pro        — LilyGO T-Encoder Pro (390×390 AMOLED)
;   waveshare-knob-18   — Waveshare ESP32-S3-Knob-Touch-LCD-1.8 (360×360 IPS)
;
; Override auto:  pio run -e tencoder-pro
;                 set FLIGHTSCNR_BOARD=waveshare-knob-18
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = auto
boards_dir = boards
lib_dir = lib

[env]
platform = espressif32@6.5.0
board = esp32s3_flash_16MB
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts =
	pre:scripts/auto_select_board.py
	pre:scripts/generate_icao_types.py
	pre:scripts/generate_airports.py
	pre:scripts/generate_airline_logos.py
	pre:scripts/generate_aircraft_icons.py
	post:scripts/merge_firmware.py
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.sdkconfig_options =
	CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
build_flags =
	-Wall
	-D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
	-D CORE_DEBUG_LEVEL=1
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_RUNNING_CORE=1
	-D ARDUINO_EVENT_RUNNING_CORE=0
	-D WM_NODEBUG
	-D WM_MDNS
	-D WEBSERVER_MAX_POST_ARGS=96
	-I include/hardware
lib_deps =
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^7.4.2
	bitbank2/AnimatedGIF@^2.1.1
	bitbank2/JPEGDEC@^1.8.0
	ricmoo/QRCode@^0.0.1

; Placeholder env — auto_select_board.py remaps this to a concrete board before build.
[env:auto]
extends = env
build_flags =
	${env.build_flags}
	-D FLIGHTSCNR_BOARD_TENCODER_PRO

[env:tencoder-pro]
extends = env
build_flags =
	${env.build_flags}
	-D FLIGHTSCNR_BOARD_TENCODER_PRO

; Env name cannot contain '.' (PlatformIO 6.1.19+).
[env:waveshare-knob-18]
extends = env
build_flags =
	${env.build_flags}
	-D FLIGHTSCNR_BOARD_WAVESHARE_KNOB_18

[env:native]
platform = native
; [env] applies to every env, so arduino/board/scripts have to be cleared here
; or the host test build tries to pull in the ESP32 framework.
framework =
extra_scripts =
test_framework = unity
lib_deps = bblanchon/ArduinoJson@^7.4.2
build_flags = -std=gnu++17 -Iinclude -D FLIGHTSCNR_BOARD_TENCODER_PRO
build_src_filter = +<services/adsbdb_parse.cpp> +<services/altitude_filter.cpp> +<services/clock_format.cpp> +<services/firmware_image.cpp> +<services/open_meteo_parse.cpp> +<services/route_waterfall.cpp> +<services/watch_type_parse.cpp> +<services/watch_reg_parse.cpp> +<ui/label_layout.cpp>
test_build_src = yes

; Waveshare ESP32-P4-WIFI6-Touch-LCD-4C — 720×720 round MIPI-DSI (JD9365-class) + GT9271 touch.
; Needs Arduino-ESP32 3.x (pioarduino); the S3 envs above stay on espressif32 6.5.0.
; Pinned to Arduino 3.3.11 / IDF 5.5.5: the core Waveshare's own 4C examples are CI-tested on.
;
; Chip revision matters: rev3 and pre-rev3 binaries are NOT interchangeable.
;   waveshare-p4-4c     — ESP32-P4 rev 3.x silicon (Waveshare's current default)
;   waveshare-p4-4c-v1  — pre-rev3 silicon (v1.x, e.g. v1.3)
; Check yours with:  esptool --chip esp32p4 chip-id   (look for "Chip is ESP32-P4 (revision v…)")
;
; First install on Windows can fail with WindowsLongPathError; run once with a short cache dir:
;   set PLATFORMIO_CACHE_DIR=C:\pioc  &&  pio pkg install -e waveshare-p4-4c
; Run pio from PowerShell/cmd, not Git Bash: the P4 toolchain installer rejects MSYS.
[p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; The S3 envs (espressif32 6.5.0, Arduino 2.0.14) and these P4 envs both install a
; package named framework-arduinoespressif32, and they overwrite each other in one
; PlatformIO core dir. Pinning by URL makes the P4 env reinstall 3.3.11 if needed, but
; to build the S3 boards on the same PC, give them their own core dir, e.g. (PowerShell):
;   $env:PLATFORMIO_CORE_DIR='C:\pio-s3'; pio run -e tencoder-pro
platform_packages =
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
; 32 MB flash: two 12.5 MB OTA app slots + 6.75 MB LittleFS (core's default_32MB.csv).
; The 720 px fonts and later photo/feature work need more than the S3's 6.25 MB slots.
board_upload.maximum_size = 13107200
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_32MB.csv
; [env] sets qio_opi for the S3 boards; the P4 core only ships qio_qspi / dio_qspi.
board_build.arduino.memory_type = qio_qspi
upload_speed = 921600
extra_scripts =
	pre:scripts/p4_gfx_filter.py
	pre:scripts/generate_icao_types.py
	pre:scripts/generate_airports.py
	pre:scripts/generate_airline_logos.py
	pre:scripts/generate_aircraft_icons.py
	post:scripts/merge_firmware.py
board_build.sdkconfig_options =
build_flags =
	-Wall
	-D CORE_DEBUG_LEVEL=1
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D WM_NODEBUG
	-D WM_MDNS
	-D WEBSERVER_MAX_POST_ARGS=96
	-I include/hardware
	-D FLIGHTSCNR_BOARD_WAVESHARE_P4_4C
	; WiFiManager reads this ESP32 PHY option, which the P4 (Wi-Fi via C6) does not define.
	-D CONFIG_ESP32_PHY_MAX_WIFI_TX_POWER=20

lib_deps =
	${env.lib_deps}
	bitbank2/PNGdec@^1.1.0

[env:waveshare-p4-4c]
extends = p4
board = esp32-p4_r3

[env:waveshare-p4-4c-v1]
extends = p4
board = esp32-p4
; Own board name (waveshare-p4-4c-v1) so OTA fetches the pre-rev3 app image.
build_flags =
	${p4.build_flags}
	-D FLIGHTSCNR_P4_PRE_REV3=1

; Desktop simulator (Windows): runs the real firmware — main.cpp, UI, adsb.fi /
; weather / route code and the P4 panel + touch drivers — in a 720x720 SDL window.
; Hardware underneath is faked by sim/shim + sim/src; see sim/README.md.
;   pio run -e sim        then   .pio\build\sim\program.exe --lat 27.95 --lon -82.46
; Needs MinGW-w64 GCC on PATH (winget install BrechtSanders.WinLibs.POSIX.UCRT).
[env:sim]
platform = native
framework =
extra_scripts =
	pre:scripts/sim_setup.py
	pre:scripts/p4_gfx_filter.py
lib_deps =
	bblanchon/ArduinoJson@^7.4.2
	bitbank2/JPEGDEC@^1.8.0
	bitbank2/AnimatedGIF@^2.1.1
	ricmoo/QRCode@^0.0.1
	bitbank2/PNGdec@^1.1.0
lib_ignore =
	Driver Bus Library Based on Arduino
	SensorLib
	WiFiManager
	bb_spi_lcd
build_flags =
	-O2
	-Wall
	-Wno-unused-function
	-I sim/shim
	-I sim/arduino_core
	-I sim/src
	-I include
	-I include/hardware
	-D FLIGHTSCNR_BOARD_WAVESHARE_P4_4C
	-D FLIGHTSCNR_SIM
	; Libraries (AnimatedGIF, QRCode, ...) pick their Arduino code paths from this.
	-D ARDUINO=10819
	; Plain C paths in AnimatedGIF / JPEGDEC (their SIMD code is ESP32-S3/P4 assembly).
	-D NO_SIMD
	-D BOARD_HAS_PSRAM
	-D NOMINMAX
	-D WIN32_LEAN_AND_MEAN
	-D _USE_MATH_DEFINES
	-D _POSIX_THREAD_SAFE_FUNCTIONS
	; ESP32 (Xtensa/RISC-V) chars are unsigned; the generated lookup tables rely on it.
	-funsigned-char
	; PNGdec's inflate.c uses newlib's `uint`, which MinGW does not define.
	-D uint=unsigned
build_src_filter =
	+<*>
	-<services/wifi_setup.cpp>
	-<services/settings_web.cpp>
	-<services/ota_github.cpp>
	+<../sim/src/>
	+<../sim/arduino_core/>
