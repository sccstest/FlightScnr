; One-off tool: update the ESP32-C6 co-processor's ESP-Hosted firmware from the P4,
; with the image embedded in this sketch (no Wi-Fi needed). The image is Arduino's
; published build that matches arduino-esp32 3.3.11 (ESP-Hosted 2.12.11):
;   https://espressif.github.io/arduino-esp32/hosted/esp32c6-v2.12.11.bin
; Put it in fw/ (not committed). Nothing is written until the sketch receives the
; line "UPDATE-C6" on its USB serial port. See src/main.cpp.
;
; Build (PowerShell, from this folder):  $env:PLATFORMIO_CACHE_DIR='C:\pioc'; pio run
; Flash the app only, to keep the P4's saved settings:
;   py -3.13 -m esptool --port COM3 --baud 921600 write-flash 0x10000 .pio\build\p4\firmware.bin

[env:p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
platform_packages =
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
board = esp32-p4_r3
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_32MB.csv
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
build_flags =
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=1
