; One-off helper: turns the Waveshare ESP32-P4-WIFI6-Touch-LCD-4C into a USB-to-UART
; bridge for its own ESP32-C6, so the C6's ESP-Hosted firmware can be flashed without a
; separate USB-serial adapter. See src/main.cpp for the wiring. Not part of FlightScnr.
;
; Build/flash (PowerShell, from this folder):
;   $env:PLATFORMIO_CACHE_DIR='C:\pioc'; pio run
;   py -3.13 -m esptool --port COM3 --baud 921600 write-flash 0 .pio\build\p4\firmware.factory.bin
; (Or write bootloader/partitions/app separately; see README.md.)

[env:p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
platform_packages =
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
board = esp32-p4_r3
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=0
