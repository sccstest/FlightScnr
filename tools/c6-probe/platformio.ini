; Diagnostic: bare Arduino Wi-Fi bring-up on the Waveshare ESP32-P4-WIFI6-Touch-LCD-4C.
; Prints the ESP-Hosted host/C6 firmware versions and a network scan on the USB port.
; Use it to tell a C6 / ESP-Hosted problem apart from a FlightScnr problem.
; Build (PowerShell, from this folder):  $env:PLATFORMIO_CACHE_DIR='C:\pioc'; pio run

[env:p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
platform_packages =
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
board = esp32-p4_r3
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
build_flags =
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=5
